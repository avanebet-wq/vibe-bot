<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, user-scalable=no" />
<title>Удобное создание кнопок</title>
<script src="https://telegram.org/js/telegram-web-app.js"></script>
<style>
  :root{
    --bg:            var(--tg-theme-bg-color, #000000);
    --secondary-bg:  var(--tg-theme-secondary-bg-color, #0e0e0e);
    --text:          var(--tg-theme-text-color, #ffffff);
    --hint:          var(--tg-theme-hint-color, #8d8d93);
    --link:          var(--tg-theme-link-color, #4dabf7);
    --button:        var(--tg-theme-button-color, #4dabf7);
    --button-text:   var(--tg-theme-button-text-color, #ffffff);
    --outline:       #2c2c2e;
    --green:         #46b970;
    --red:           #e05b58;
    --blue:          #4dabf7;
    --safe-bottom:   env(safe-area-inset-bottom, 0px);
  }
  *{ box-sizing:border-box; -webkit-tap-highlight-color: transparent; }
  html,body{ height:100%; }
  body{
    margin:0;
    background:var(--bg);
    color:var(--text);
    font-family:-apple-system, BlinkMacSystemFont, "SF Pro Text", Roboto, Helvetica, Arial, sans-serif;
    overscroll-behavior-y:none;
  }
  #app{ min-height:100vh; padding:20px 16px calc(96px + var(--safe-bottom)); }
  .hidden{ display:none !important; }

  /* ---------- main screen ---------- */
  .rows{ display:flex; flex-direction:column; gap:10px; margin-top:4px; }
  .row{ display:flex; gap:8px; }
  .btn-pill{
    flex:1 1 0;
    min-width:0;
    display:flex; align-items:center; justify-content:center; gap:6px;
    padding:13px 10px;
    border-radius:12px;
    font-size:15px;
    font-weight:600;
    border:1px solid transparent;
    background:#fff;
    color:#1c1c1e;
    cursor:pointer;
    white-space:nowrap;
    overflow:hidden;
    text-overflow:ellipsis;
  }
  .btn-pill span.label{ overflow:hidden; text-overflow:ellipsis; }
  .btn-pill img.emoji{ width:18px; height:18px; flex:0 0 auto; }
  .btn-pill.style-transparent{ background:transparent; color:var(--link); border-color:var(--outline); }
  .btn-pill.style-blue{ background:var(--blue); color:#fff; }
  .btn-pill.style-green{ background:var(--green); color:#fff; }
  .btn-pill.style-red{ background:var(--red); color:#fff; }

  .row-add{
    flex:0 0 44px;
    display:flex; align-items:center; justify-content:center;
    border-radius:12px;
    border:1px dashed var(--outline);
    color:var(--hint);
    font-size:20px;
    cursor:pointer;
  }
  .row-add.hidden{ display:none; }

  .add-row-btn{
    display:block;
    margin:22px auto 0;
    background:#fff;
    color:var(--link);
    border:none;
    border-radius:12px;
    font-size:17px;
    font-weight:600;
    padding:14px 26px;
    cursor:pointer;
  }

  .empty-hint{
    text-align:center;
    color:var(--hint);
    font-size:14px;
    margin-top:14px;
    line-height:1.4;
  }
  .limit-hint{ text-align:center; color:var(--hint); font-size:13px; margin-top:18px; }

  /* ---------- fixed save bar ---------- */
  .save-bar{
    position:fixed; left:0; right:0; bottom:0;
    padding:10px 16px calc(14px + var(--safe-bottom));
    background:linear-gradient(to top, var(--bg) 60%, transparent);
  }
  .save-btn{
    width:100%;
    background:var(--green);
    color:#fff;
    border:none;
    border-radius:14px;
    padding:16px;
    font-size:16px;
    font-weight:700;
    letter-spacing:.3px;
    cursor:pointer;
  }
  .save-btn:disabled{ opacity:.5; }

  /* ---------- editor screen ---------- */
  .editor-head{
    display:flex; align-items:center; justify-content:space-between;
    margin-bottom:22px;
  }
  .editor-title{ font-size:22px; font-weight:700; }
  .close-x{
    width:30px; height:30px;
    display:flex; align-items:center; justify-content:center;
    color:var(--hint);
    font-size:20px;
    cursor:pointer;
    border-radius:50%;
  }
  .field{ margin-bottom:22px; }
  .field-label{ font-size:17px; font-weight:700; margin-bottom:10px; }
  .field-hint{ font-size:13px; color:var(--hint); margin-top:8px; line-height:1.4; }
  .button-name-preview{
    display:flex; align-items:center; gap:8px;
    min-height:42px; margin-top:10px; padding:9px 12px;
    border:1px solid var(--outline); border-radius:10px;
    background:var(--secondary-bg); color:var(--text);
    font-size:15px; font-weight:600;
  }
  .button-name-preview img{ width:22px; height:22px; flex:0 0 auto; object-fit:contain; }
  .button-name-preview .preview-label{ overflow:hidden; text-overflow:ellipsis; white-space:nowrap; }
  .button-name-preview.empty{ color:var(--hint); font-weight:400; }

  .control{
    width:100%;
    background:transparent;
    border:1.5px solid var(--outline);
    border-radius:12px;
    color:var(--text);
    font-size:16px;
    padding:14px 14px;
    outline:none;
    font-family:inherit;
  }
  .control::placeholder{ color:#5c5c60; }

  .select-wrap{ position:relative; }
  .select-wrap select.control{
    appearance:none; -webkit-appearance:none;
    padding-right:38px;
    cursor:pointer;
  }
  .select-wrap::after{
    content:"";
    position:absolute; right:16px; top:50%;
    width:10px; height:10px;
    border-right:2px solid var(--hint);
    border-bottom:2px solid var(--hint);
    transform:translateY(-65%) rotate(45deg);
    pointer-events:none;
  }

  .emoji-box{
    border:1.5px solid var(--outline);
    border-radius:14px;
    padding:12px;
  }
  .emoji-search{
    width:100%;
    background:transparent;
    border:1.5px solid var(--outline);
    border-radius:12px;
    color:var(--text);
    font-size:15px;
    padding:12px 14px;
    outline:none;
    margin-bottom:12px;
    font-family:inherit;
  }
  .emoji-search::placeholder{ color:#5c5c60; }
  .emoji-pack-tabs{
    display:flex; gap:8px;
    overflow-x:auto;
    padding:2px 2px 10px;
    margin-bottom:2px;
    scrollbar-width:none;
  }
  .emoji-pack-tabs::-webkit-scrollbar{ display:none; }
  .emoji-pack-tab{
    flex:0 0 44px; width:44px; height:44px;
    border:1px solid var(--outline);
    border-radius:12px;
    background:#1c1c1e;
    display:flex; align-items:center; justify-content:center;
    cursor:pointer;
    padding:7px;
    opacity:.72;
  }
  .emoji-pack-tab.selected{
    opacity:1;
    outline:2px solid var(--blue);
    outline-offset:0;
  }
  .emoji-pack-tab img{ width:30px; height:30px; object-fit:contain; }
  .emoji-grid{
    display:grid;
    grid-template-rows:repeat(3, 44px);
    grid-auto-flow:column;
    grid-auto-columns:44px;
    gap:8px;
    overflow-x:auto;
    overflow-y:hidden;
    padding:2px;
    min-height:140px;
    max-height:148px;
    scrollbar-width:thin;
  }
  .emoji-cell{
    width:44px; height:44px;
    border-radius:10px;
    display:flex; align-items:center; justify-content:center;
    font-size:22px;
    background:#1c1c1e;
    cursor:pointer;
    position:relative;
  }
  .emoji-cell img{ width:26px; height:26px; }
  .emoji-cell.add{ background:var(--blue); color:#fff; font-size:22px; font-weight:700; }
  .emoji-cell.selected{ outline:2px solid var(--blue); }
  .emoji-cell .rm{
    position:absolute; top:-5px; right:-5px;
    width:16px; height:16px; border-radius:50%;
    background:var(--red); color:#fff;
    font-size:11px; line-height:16px; text-align:center;
  }
  .emoji-empty{ color:var(--hint); font-size:13px; padding:6px 2px; }
  .emoji-pack-add-btn{
    flex:0 0 44px; width:44px; height:44px;
    border:1px dashed var(--outline);
    border-radius:12px;
    background:transparent;
    display:flex; align-items:center; justify-content:center;
    cursor:pointer;
    font-size:22px;
    color:var(--hint);
    transition:color .15s, border-color .15s;
  }
  .emoji-pack-add-btn:hover{ color:var(--blue); border-color:var(--blue); }
  .field-error{ color:#e05b58; font-size:12px; margin-top:4px; display:none; }
  .field-error.show{ display:block; }

  .editor-actions{
    display:flex; gap:10px;
    margin-top:26px;
  }
  .editor-actions button{
    flex:1;
    border:none;
    border-radius:14px;
    padding:15px;
    font-size:16px;
    font-weight:700;
    cursor:pointer;
  }
  .btn-delete{ background:var(--red); color:#fff; }
  .btn-save{ background:var(--green); color:#fff; }

  .toast{
    position:fixed; left:50%; bottom:100px;
    transform:translateX(-50%);
    background:#1c1c1e; color:#fff;
    padding:10px 16px; border-radius:10px;
    font-size:14px;
    opacity:0; pointer-events:none;
    transition:opacity .2s;
    max-width:88%;
    text-align:center;
  }
  .toast.show{ opacity:1; }
</style>
</head>
<body>
<div id="app">

  <!-- ===================== MAIN SCREEN ===================== -->
  <section id="screen-main">
    <div id="rows" class="rows"></div>
    <div id="emptyHint" class="empty-hint">Пока нет ни одной кнопки.<br>Нажмите «Добавить строку», чтобы начать.</div>
    <button id="addRowBtn" class="add-row-btn">Добавить строку</button>
    <div id="limitHint" class="limit-hint hidden">Достигнут лимит: 15 рядов</div>
  </section>

  <!-- ===================== EDITOR SCREEN ===================== -->
  <section id="screen-editor" class="hidden">
    <div class="editor-head">
      <div class="editor-title">Кнопка управления</div>
      <div class="close-x" id="editorClose">&#10005;</div>
    </div>

    <div class="field">
      <div class="field-label">Тип кнопки</div>
      <div class="select-wrap">
        <select id="fType" class="control"></select>
      </div>
    </div>

    <div class="field">
      <div class="field-label">Имя</div>
      <input id="fName" class="control" type="text" maxlength="30" placeholder="Название на кнопке" />
      <div id="buttonNamePreview" class="button-name-preview empty">
        <span class="preview-label">Предпросмотр кнопки</span>
      </div>
    </div>

    <div class="field" id="fValueField">
      <div class="field-label" id="fValueLabel">Ссылка</div>
      <input id="fValue" class="control" type="text" placeholder="t.me/username" />
      <div class="field-hint" id="fValueHint"></div>
      <div class="field-error" id="fValueError"></div>
    </div>

    <div class="field">
      <div class="field-label">Стиль кнопки</div>
      <div class="select-wrap">
        <select id="fStyle" class="control">
          <option value="transparent">Прозрачный</option>
          <option value="blue">Синий</option>
          <option value="green">Зелёный</option>
          <option value="red">Красный</option>
        </select>
      </div>
    </div>

    <div class="field">
      <div class="field-label">Настроить премиум эмодзи</div>
      <div class="emoji-box">
        <input id="emojiSearch" class="emoji-search" type="text" placeholder="Поиск по эмодзи (например 🍕)" />
        <div id="emojiPackTabs" class="emoji-pack-tabs"></div>
        <div id="emojiGrid" class="emoji-grid"></div>
      </div>
    </div>

    <div class="editor-actions">
      <button class="btn-delete" id="fDelete">Удалить</button>
      <button class="btn-save" id="fSave">Сохранить</button>
    </div>
  </section>

</div>

<!-- ===================== SAVE BAR (main screen only) ===================== -->
<div id="saveBar" class="save-bar">
  <button id="saveBtn" class="save-btn">СОХРАНИТЬ</button>
</div>

<div id="toast" class="toast"></div>

<script>
(function(){
  "use strict";

  /* ------------------------------------------------------------------
   *  CONFIG
   *  Point API_BASE at your bot's backend. It must expose:
   *    GET  /api/context?chat_id=..&post_id=..      -> { rows: [...] }
   *    GET  /api/emojis?q=search                    -> [{id, previewUrl}]
   *    POST /api/save-buttons                       -> { ok:true }
   *  Every request must include header:
   *    Authorization: tma <initData>
   *  so the server can validate the request per Telegram's documented
   *  initData verification scheme and re-check that this user is an
   *  admin of chat_id before writing anything. NEVER trust chat_id/
   *  client IDs or admin status without server-side verification.
   * ------------------------------------------------------------------ */
  var CONFIG = {
    API_BASE: window.location.origin
  };

  var tg = window.Telegram && window.Telegram.WebApp ? window.Telegram.WebApp : null;
  if (tg) {
    tg.ready();
    tg.expand();
    if (tg.setHeaderColor) try { tg.setHeaderColor("secondary_bg_color"); } catch(e){}
  }

  var qs = new URLSearchParams(location.search);
  var startParam = (tg && tg.initDataUnsafe && tg.initDataUnsafe.start_param) ||
                   qs.get("tgWebAppStartParam") || "";
  var decodedStart = decodeStartParam(startParam);
  var CHAT_ID = qs.get("chat_id") || decodedStart.chat_id;
  var POST_ID = qs.get("post_id") || decodedStart.post_id;
  var EDIT_MODE = qs.get("mode") === "edit" || !!decodedStart.edit;
  var INIT_DATA = tg ? tg.initData : "";

  function decodeStartParam(sp){
    // Bot side may encode something like "c-1001234567890_p1".
    var out = {chat_id:null, post_id:null};
    var m = /^c(-?\d+)_p([A-Za-z0-9_-]+)$/.exec(sp || "");
    if (m){ out.chat_id = m[1]; out.post_id = m[2].replace(/_e$/, ""); out.edit = /_e$/.test(m[2]); }
    return out;
  }

  var MAX_ROWS = 15;
  var MAX_PER_ROW = 4;

  var BUTTON_TYPES = [
    { id:"url",             label:"Ссылка",            placeholder:"t.me/username",        hint:"Обычная ссылка, которая откроется при нажатии на кнопку." },
    { id:"popup",            label:"Всплывающее окно",  placeholder:"Текст сообщения",       hint:"Текст, который увидит пользователь во всплывающем окне Telegram." },
    { id:"alert",            label:"Тревога",           placeholder:"Текст оповещения",       hint:"Короткое уведомление (alert), исчезает автоматически." },
    { id:"share",            label:"Поделиться",        placeholder:"Текст или ссылка",        hint:"Контент, которым поделится пользователь через стандартное меню «Поделиться»." },
    { id:"copy",             label:"Копировать",        placeholder:"Текст для копирования",   hint:"Текст будет скопирован в буфер обмена пользователя." },
    { id:"rules",            label:"Правила",           placeholder:"Текст правил",            hint:"Текст правил группы — откроется во всплывающем окне." },
    { id:"user_command",     label:"Личная команда",    placeholder:"/command",               hint:"Команда бота, выполняемая от имени нажавшего пользователя." },
    { id:"delete_message",   label:"Удаление сообщения", placeholder:"",                      hint:"Нажатие удаляет это сообщение. Дополнительные данные не нужны." }
  ];
  var TYPE_BY_ID = {};
  BUTTON_TYPES.forEach(function(t){ TYPE_BY_ID[t.id] = t; });

  var STYLES = ["transparent","blue","green","red"];

  /* ------------------------------------------------------------------
   *  STATE
   *  rows: [ [ {id,type,name,value,style,customEmojiId,customEmojiPreview}, ... ], ... ]
   * ------------------------------------------------------------------ */
  var state = { rows: [] };
  var editing = null; // {rowIndex, btnIndex, isNew}
  var uid = 1;
  function nextId(){ return "b" + (uid++); }

  /* ------------------------------------------------------------------
   *  DOM refs
   * ------------------------------------------------------------------ */
  var el = {
    screenMain:   document.getElementById("screen-main"),
    screenEditor: document.getElementById("screen-editor"),
    rows:         document.getElementById("rows"),
    emptyHint:    document.getElementById("emptyHint"),
    addRowBtn:    document.getElementById("addRowBtn"),
    limitHint:    document.getElementById("limitHint"),
    saveBar:      document.getElementById("saveBar"),
    saveBtn:      document.getElementById("saveBtn"),

    editorClose:  document.getElementById("editorClose"),
    fType:        document.getElementById("fType"),
    fName:        document.getElementById("fName"),
    buttonNamePreview: document.getElementById("buttonNamePreview"),
    fValueField:  document.getElementById("fValueField"),
    fValueLabel:  document.getElementById("fValueLabel"),
    fValue:       document.getElementById("fValue"),
    fValueHint:   document.getElementById("fValueHint"),
    fValueError:  document.getElementById("fValueError"),
    fStyle:       document.getElementById("fStyle"),
    emojiSearch:  document.getElementById("emojiSearch"),
    emojiPackTabs:document.getElementById("emojiPackTabs"),
    emojiGrid:    document.getElementById("emojiGrid"),
    fDelete:      document.getElementById("fDelete"),
    fSave:        document.getElementById("fSave"),
    toast:        document.getElementById("toast")
  };

  BUTTON_TYPES.forEach(function(t){
    var o = document.createElement("option");
    o.value = t.id; o.textContent = t.label;
    el.fType.appendChild(o);
  });

  /* ------------------------------------------------------------------
   *  RENDER: main screen
   * ------------------------------------------------------------------ */
  function renderMain(){
    el.rows.innerHTML = "";
    el.emptyHint.classList.toggle("hidden", state.rows.length > 0);
    el.limitHint.classList.toggle("hidden", state.rows.length < MAX_ROWS);
    el.addRowBtn.classList.toggle("hidden", state.rows.length >= MAX_ROWS);

    state.rows.forEach(function(row, rowIndex){
      var rowEl = document.createElement("div");
      rowEl.className = "row";

      row.forEach(function(btn, btnIndex){
        rowEl.appendChild(renderPill(btn, rowIndex, btnIndex));
      });

      if (row.length < MAX_PER_ROW){
        var addCell = document.createElement("div");
        addCell.className = "row-add";
        addCell.textContent = "+";
        addCell.addEventListener("click", function(){
          var btn = makeBlankButton();
          row.push(btn);
          openEditor(rowIndex, row.length - 1, true);
        });
        rowEl.appendChild(addCell);
      }

      el.rows.appendChild(rowEl);
    });
  }

  function renderPill(btn, rowIndex, btnIndex){
    var pill = document.createElement("div");
    pill.className = "btn-pill style-" + btn.style;
    if (btn.customEmojiPreview){
      var img = document.createElement("img");
      img.className = "emoji"; img.src = btn.customEmojiPreview;
      pill.appendChild(img);
    }
    var span = document.createElement("span");
    span.className = "label";
    span.textContent = btn.name || TYPE_BY_ID[btn.type].label;
    pill.appendChild(span);
    pill.addEventListener("click", function(){ openEditor(rowIndex, btnIndex, false); });
    return pill;
  }

  function makeBlankButton(){
    return { id: nextId(), type:"url", name:"", value:"", style:"transparent", customEmojiId:null, customEmojiPreview:null };
  }

  el.addRowBtn.addEventListener("click", function(){
    if (state.rows.length >= MAX_ROWS) return;
    var btn = makeBlankButton();
    state.rows.push([btn]);
    openEditor(state.rows.length - 1, 0, true);
  });

  /* ------------------------------------------------------------------
   *  EDITOR
   * ------------------------------------------------------------------ */
  function openEditor(rowIndex, btnIndex, isNew){
    editing = { rowIndex: rowIndex, btnIndex: btnIndex, isNew: isNew };
    var btn = state.rows[rowIndex][btnIndex];

    el.fType.value = btn.type;
    el.fName.value = btn.name;
    el.fValue.value = btn.value;
    el.fStyle.value = btn.style;
    syncValueField(btn.type);
    el.emojiSearch.value = "";
    activePackId = null;
    renderButtonNamePreview(btn);
    fetchPacks().then(function(){
      renderEmojiGrid(btn.customEmojiId, btn.customEmojiPreview, "");
    });

    el.screenMain.classList.add("hidden");
    el.saveBar.classList.add("hidden");
    el.screenEditor.classList.remove("hidden");
    window.scrollTo(0,0);

    if (tg && tg.BackButton){
      tg.BackButton.show();
      tg.BackButton.onClick(closeEditorDiscard);
    }
  }

  function syncValueField(typeId){
    var t = TYPE_BY_ID[typeId];
    if (typeId === "delete_message"){
      el.fValueField.classList.add("hidden");
    } else {
      el.fValueField.classList.remove("hidden");
      el.fValueLabel.textContent = typeId === "url" ? "Ссылка" : "Данные";
      el.fValue.placeholder = t.placeholder;
      el.fValueHint.textContent = t.hint;
    }
  }
  el.fType.addEventListener("change", function(){ syncValueField(el.fType.value); });

  function renderButtonNamePreview(btn){
    el.buttonNamePreview.innerHTML = "";
    var previewText = (el.fName.value || btn.name || TYPE_BY_ID[btn.type].label || "Название").trim();
    if (btn.customEmojiPreview){
      var img = document.createElement("img");
      img.src = btn.customEmojiPreview;
      img.alt = "";
      el.buttonNamePreview.appendChild(img);
      el.buttonNamePreview.classList.remove("empty");
    } else {
      el.buttonNamePreview.classList.add("empty");
    }
    var span = document.createElement("span");
    span.className = "preview-label";
    span.textContent = previewText || "Название кнопки";
    el.buttonNamePreview.appendChild(span);
  }

  el.fName.addEventListener("input", function(){
    if (!editing) return;
    var btn = state.rows[editing.rowIndex][editing.btnIndex];
    renderButtonNamePreview(btn);
  });

  function closeEditorDiscard(){
    // if a brand-new empty button was never saved, drop it and its row if now empty
    if (editing && editing.isNew){
      var row = state.rows[editing.rowIndex];
      row.splice(editing.btnIndex, 1);
      if (row.length === 0) state.rows.splice(editing.rowIndex, 1);
    }
    backToMain();
  }

  function backToMain(){
    editing = null;
    el.screenEditor.classList.add("hidden");
    el.screenMain.classList.remove("hidden");
    el.saveBar.classList.remove("hidden");
    if (tg && tg.BackButton) tg.BackButton.hide();
    renderMain();
  }

  el.editorClose.addEventListener("click", closeEditorDiscard);

  el.fDelete.addEventListener("click", function(){
    if (!editing) return;
    var row = state.rows[editing.rowIndex];
    row.splice(editing.btnIndex, 1);
    if (row.length === 0) state.rows.splice(editing.rowIndex, 1);
    editing.isNew = false; // already handled
    backToMain();
  });

  function isValidButtonUrl(value){
    try {
      var u = new URL(value.trim());
      if (u.protocol !== "http:" && u.protocol !== "https:") return false;
      var host = u.hostname || "";
      // Must have at least one dot (real TLD)
      return /^[a-z0-9](?:[a-z0-9\-]{0,61}[a-z0-9])?(?:\.[a-z0-9](?:[a-z0-9\-]{0,61}[a-z0-9])?)+$/i.test(host);
    } catch(e){ return false; }
  }

  function showUrlError(msg){
    el.fValueError.textContent = msg;
    el.fValueError.classList.add("show");
  }
  function hideUrlError(){
    el.fValueError.classList.remove("show");
    el.fValueError.textContent = "";
  }

  el.fValue.addEventListener("input", function(){
    if (el.fType.value === "url") hideUrlError();
  });

  el.fSave.addEventListener("click", function(){
    if (!editing) return;
    var name = el.fName.value.trim();
    if (!name){ showToast("Укажите имя кнопки"); return; }
    var typ = el.fType.value;
    var val = el.fValue.value.trim();
    if (typ !== "delete_message" && !val){
      showToast("Заполните поле «" + el.fValueLabel.textContent + "»");
      return;
    }
    if (typ === "url" && val && !isValidButtonUrl(val)){
      showUrlError("Непонятная ссылка, используйте другую (например https://t.me/username)");
      el.fValue.focus();
      return;
    }
    hideUrlError();
    var btn = state.rows[editing.rowIndex][editing.btnIndex];
    btn.type = typ;
    btn.name = name;
    btn.value = typ === "delete_message" ? "" : val;
    btn.style = el.fStyle.value;
    editing.isNew = false;
    backToMain();
  });

  /* ------------------------------------------------------------------
   *  PREMIUM EMOJI PICKER
   *  The library is global and grouped by Telegram custom-emoji sticker set.
   *  Tabs are shown only as one custom emoji preview per pack. The first
   *  (oldest) pack is selected by default. Without search, only the selected
   *  pack is rendered. Search ignores the active pack and searches globally
   *  by Telegram's ordinary `Sticker.emoji` value.
   * ------------------------------------------------------------------ */
  var DEMO_PACKS = [
    { id:1, previewUrl:null, emojis:[
      { id:"demo_1", emoji:"😀", previewUrl:null }, { id:"demo_2", emoji:"🔥", previewUrl:null },
      { id:"demo_3", emoji:"⭐", previewUrl:null }, { id:"demo_4", emoji:"🍕", previewUrl:null },
      { id:"demo_5", emoji:"🚀", previewUrl:null }, { id:"demo_6", emoji:"❤️", previewUrl:null }
    ]},
    { id:2, previewUrl:null, emojis:[
      { id:"demo_7", emoji:"😎", previewUrl:null }, { id:"demo_8", emoji:"💎", previewUrl:null },
      { id:"demo_9", emoji:"🎉", previewUrl:null }, { id:"demo_10", emoji:"🌟", previewUrl:null }
    ]}
  ];

  var emojiPacks = [];
  var emojiPackCache = {};
  var activePackId = null;
  var emojiSearchTimer = null;

  function packPreview(pack){
    if (pack.previewUrl) return pack.previewUrl;
    var first = (pack.emojis || [])[0];
    return first ? first.previewUrl : null;
  }

  function renderPackTabs(){
    el.emojiPackTabs.innerHTML = "";
    el.emojiPackTabs.classList.remove("hidden");
    emojiPacks.forEach(function(pack){
      var tab = document.createElement("div");
      tab.className = "emoji-pack-tab" + (String(pack.id) === String(activePackId) ? " selected" : "");
      var src = packPreview(pack);
      if (src){
        var img = document.createElement("img");
        img.src = src;
        img.alt = "";
        tab.appendChild(img);
      } else {
        tab.textContent = ((pack.emojis || [])[0] || {}).emoji || "⭐";
      }
      tab.title = pack.isLocal ? "Пак группы: " + (pack.setName || "") : (pack.setName || "");
      tab.addEventListener("click", function(){
        activePackId = pack.id;
        renderPackTabs();
        var btn = state.rows[editing.rowIndex][editing.btnIndex];
        renderEmojiGrid(btn.customEmojiId, btn.customEmojiPreview, el.emojiSearch.value);
      });
      el.emojiPackTabs.appendChild(tab);
    });

    // + button — add a group-local pack by link
    var addBtn = document.createElement("div");
    addBtn.className = "emoji-pack-add-btn";
    addBtn.textContent = "+";
    addBtn.title = "Добавить пак для этой группы";
    addBtn.addEventListener("click", function(){
      var link = prompt("Вставьте ссылку на пак эмодзи (t.me/addstickers/ИМЯ):");
      if (!link || !link.trim()) return;
      var chatId = CHAT_ID;
      if (!chatId){ showToast("Не удалось определить группу"); return; }
      authFetch("/api/group-pack/add", {
        method: "POST",
        headers: { "Content-Type": "application/json" },
        body: JSON.stringify({ chat_id: chatId, link: link.trim() })
      }).then(function(r){ return r.json(); }).then(function(d){
        if (d.ok){
          showToast(d.already ? "Этот пак уже добавлен" : "Пак добавлен! Загружаю эмодзи…");
          emojiPackCache = {};
          fetchPacks();
        } else {
          showToast(d.error || "Не удалось добавить пак");
        }
      }).catch(function(){ showToast("Ошибка сети при добавлении пака"); });
    });
    el.emojiPackTabs.appendChild(addBtn);
  }

  function normalizeSearchEmoji(value){
    return (value || "").replace(/\ufe0f/g, "").trim();
  }

  el.emojiSearch.addEventListener("input", function(){
    clearTimeout(emojiSearchTimer);
    var q = el.emojiSearch.value;
    emojiSearchTimer = setTimeout(function(){
      if (!editing) return;
      var btn = state.rows[editing.rowIndex][editing.btnIndex];
      renderEmojiGrid(btn.customEmojiId, btn.customEmojiPreview, q);
    }, 150);
  });

  function renderEmojiGrid(selectedId, selectedPreview, query){
    el.emojiGrid.innerHTML = "";

    var addCell = document.createElement("div");
    addCell.className = "emoji-cell add";
    addCell.textContent = "+";
    addCell.title = "Без эмодзи";
    addCell.addEventListener("click", function(){
      var btn = state.rows[editing.rowIndex][editing.btnIndex];
      btn.customEmojiId = null;
      btn.customEmojiPreview = null;
      renderButtonNamePreview(btn);
      renderEmojiGrid(null, null, el.emojiSearch.value);
    });
    el.emojiGrid.appendChild(addCell);

    fetchEmojis(query || "", query ? null : activePackId).then(function(list){
      if (!list.length){
        var empty = document.createElement("div");
        empty.className = "emoji-empty";
        empty.textContent = query ? "Ничего не найдено" : "В этом паке пока нет premium-эмодзи.";
        el.emojiGrid.appendChild(empty);
        return;
      }
      list.forEach(function(item){
        var cell = document.createElement("div");
        cell.className = "emoji-cell" + (item.id === selectedId ? " selected" : "");
        cell.title = item.emoji || item.name || item.id;
        if (item.previewUrl){
          var img = document.createElement("img");
          img.src = item.previewUrl;
          img.alt = "";
          img.style.width = "30px";
          img.style.height = "30px";
          img.style.objectFit = "contain";
          cell.appendChild(img);
        } else {
          cell.textContent = item.emoji || "⭐";
        }
        cell.addEventListener("click", function(){
          var btn = state.rows[editing.rowIndex][editing.btnIndex];
          btn.customEmojiId = item.id;
          btn.customEmojiPreview = item.previewUrl || null;
          renderButtonNamePreview(btn);
          renderEmojiGrid(item.id, item.previewUrl, el.emojiSearch.value);
        });
        el.emojiGrid.appendChild(cell);
      });
    });
  }

  function fetchPacks(){
    if (!CONFIG.API_BASE) {
      emojiPacks = DEMO_PACKS;
      if (activePackId === null && emojiPacks.length) activePackId = emojiPacks[0].id;
      renderPackTabs();
      return Promise.resolve(emojiPacks);
    }
    var packsUrl = "/api/emoji-packs" + (CHAT_ID ? "?chat_id=" + encodeURIComponent(CHAT_ID) : "");
    return authFetch(packsUrl)
      .then(function(r){ return r.ok ? r.json() : []; })
      .then(function(packs){
        emojiPacks = Array.isArray(packs) ? packs : [];
        // API already returns oldest-first; the first pack is the default.
        if (activePackId === null && emojiPacks.length) activePackId = emojiPacks[0].id;
        // If the active pack disappeared, fall back to the oldest one.
        if (emojiPacks.length && !emojiPacks.some(function(p){ return String(p.id) === String(activePackId); })) {
          activePackId = emojiPacks[0].id;
        }
        renderPackTabs();
        return emojiPacks;
      })
      .catch(function(){
        emojiPacks = [];
        activePackId = null;
        renderPackTabs();
        return [];
      });
  }

  function fetchEmojis(query, packId){
    if (!CONFIG.API_BASE){
      var q = normalizeSearchEmoji(query).toLowerCase();
      var all = [];
      (emojiPacks || []).forEach(function(pack){
        (pack.emojis || []).forEach(function(item){
          if (!q && String(pack.id) !== String(packId)) return;
          if (q && normalizeSearchEmoji(item.emoji).toLowerCase() !== q) return;
          all.push(item);
        });
      });
      return Promise.resolve(all);
    }
    if (query){
      return authFetch("/api/emojis?q=" + encodeURIComponent(query))
        .then(function(r){ return r.ok ? r.json() : []; })
        .catch(function(){ return []; });
    }
    if (packId === null || packId === undefined) return Promise.resolve([]);
    if (emojiPackCache[packId]) return Promise.resolve(emojiPackCache[packId]);
    return authFetch("/api/emoji-packs/" + encodeURIComponent(packId) + "/emojis")
      .then(function(r){ return r.ok ? r.json() : []; })
      .then(function(list){
        emojiPackCache[packId] = Array.isArray(list) ? list : [];
        return emojiPackCache[packId];
      })
      .catch(function(){ return []; });
  }

  /* ------------------------------------------------------------------
   *  LOAD EXISTING CONFIGURATION FOR THIS chat_id + post_id
   * ------------------------------------------------------------------ */
  function loadExisting(){
    // Всегда пытаемся подтянуть уже сохранённые кнопки для этой публикации —
    // не полагаемся на признак "режима редактирования" из startapp-параметра,
    // так как он не всегда надёжно доходит при повторном открытии.
    if (!CHAT_ID || !POST_ID) { renderMain(); return; }
    authFetch("/api/context?chat_id=" + encodeURIComponent(CHAT_ID) + "&post_id=" + encodeURIComponent(POST_ID))
      .then(function(r){ return r.ok ? r.json() : { rows: [] }; })
      .then(function(data){
        state.rows = (data.rows || []).map(function(row){
          return row.map(function(b){
            return {
              id: nextId(), type: b.type, name: b.name, value: b.value,
              style: b.style, customEmojiId: b.custom_emoji_id || null,
              customEmojiPreview: b.custom_emoji_preview || null
            };
          });
        });
      })
      .catch(function(){ /* new publication — start empty */ })
      .finally(renderMain);
  }

  /* ------------------------------------------------------------------
   *  SAVE
   * ------------------------------------------------------------------ */
  el.saveBtn.addEventListener("click", function(){
    if (!CHAT_ID || !POST_ID){
      showToast("Не удалось определить публикацию. Откройте конструктор из меню «URL-кнопки».");
      return;
    }
    var payload = {
      chat_id: CHAT_ID,
      post_id: POST_ID,
      rows: state.rows.map(function(row){
        return row.map(function(b){
          return {
            type: b.type,
            name: b.name,
            value: b.value,
            style: b.style,
            custom_emoji_id: b.customEmojiId,
            custom_emoji_preview: b.customEmojiPreview
          };
        });
      })
    };

    el.saveBtn.disabled = true;
    el.saveBtn.textContent = "Сохранение…";

    saveToServer(payload)
      .then(function(){
        showToast("Сохранено");
        if (tg){
          if (tg.HapticFeedback) tg.HapticFeedback.notificationOccurred("success");
          setTimeout(function(){ tg.close(); }, 500);
        }
      })
      .catch(function(err){
        showToast("Не удалось сохранить: " + (err && err.message ? err.message : "ошибка сети"));
      })
      .finally(function(){
        el.saveBtn.disabled = false;
        el.saveBtn.textContent = "СОХРАНИТЬ";
      });
  });

  function saveToServer(payload){
    return authFetch("/api/save-buttons", {
      method: "POST",
      headers: { "Content-Type": "application/json" },
      body: JSON.stringify(payload)
    }).then(function(r){
      if (!r.ok) return r.json().then(function(e){ throw new Error(e.error || ("HTTP " + r.status)); });
      return r.json();
    });
  }

  function authFetch(path, opts){
    opts = opts || {};
    opts.headers = opts.headers || {};
    opts.headers["Authorization"] = "tma " + (INIT_DATA || "");
    return fetch(CONFIG.API_BASE + path, opts);
  }

  /* ------------------------------------------------------------------ */
  var toastTimer = null;
  function showToast(msg){
    el.toast.textContent = msg;
    el.toast.classList.add("show");
    clearTimeout(toastTimer);
    toastTimer = setTimeout(function(){ el.toast.classList.remove("show"); }, 2200);
  }

  loadExisting();
})();
</script>
</body>
