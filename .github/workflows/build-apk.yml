name: Build APK

on:
  push:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - uses: gradle/actions/setup-gradle@v4

      - name: Build release APK
        run: ./gradlew --no-daemon assembleRelease

      - name: Name the APK
        run: cp app/build/outputs/apk/release/app-release.apk claude-pocket.apk

      - uses: actions/upload-artifact@v4
        with:
          name: claude-pocket-apk
          path: claude-pocket.apk

      # Постоянная ссылка для скачивания с телефона:
      # Releases → «Claude Pocket (последняя сборка)» → claude-pocket.apk
      - name: Publish rolling pre-release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release delete latest-apk --cleanup-tag --yes || true
          gh release create latest-apk claude-pocket.apk \
            --prerelease \
            --target "${{ github.sha }}" \
            --title "Claude Pocket (последняя сборка)" \
            --notes "Автоматическая сборка из ${{ github.sha }}. Скачай claude-pocket.apk и установи на телефон."
